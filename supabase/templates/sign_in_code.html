<!-- Sign-in email for the passwordless login (see src/routes/+page.svelte).
     Used for both the magic-link and the confirm-signup template, because a
     member's very first sign-in creates the account. The code is what the
     app asks for; the link is a fallback that only works in the browser the
     code was requested from. -->
<div
  style="
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px;
    color: #1f2937;
  "
>
  <h2 style="margin: 0 0 12px">Dein Anmeldecode</h2>
  <p style="margin: 0 0 20px">Gib diesen Code in Administra ein:</p>
  <p
    style="
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 8px;
      font-family: monospace;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin: 0 0 20px;
    "
  >
    {{ .Token }}
  </p>
  <p style="margin: 0 0 20px; font-size: 14px">
    Oder direkt: <a href="{{ .ConfirmationURL }}">Jetzt anmelden</a>
  </p>
  <p style="margin: 0; font-size: 12px; color: #6b7280">
    Der Code ist eine Stunde gültig. Du hast keine Anmeldung angefordert? Dann kannst du diese
    E-Mail ignorieren.
  </p>
  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0 16px" />
  <p style="margin: 0; font-size: 12px; color: #6b7280">
    Your Administra sign-in code: <strong>{{ .Token }}</strong>
  </p>
</div>
