name: Webling Sync

# Pulls members and events (incl. participant registrations) from Webling into
# Supabase. Replaces the systemd timers on a personal machine; see
# webling-sync/README.md for the required GitHub environments and secrets.

on:
  schedule:
    # Daily at 22:47 UTC (00:47 CEST / 23:47 CET), off the full hour because
    # GitHub delays scheduled runs that start at :00. Scheduled runs only
    # exist on the default branch and always sync prod.
    - cron: '47 22 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Supabase project'
        type: choice
        options: [prod, dev]
        default: prod
      sync:
        description: 'What to sync'
        type: choice
        options: [all, members, events]
        default: all

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets (WEBLING_*, SUPABASE_*) live in the GitHub environment of the same name
    environment: ${{ inputs.environment || 'prod' }}
    concurrency:
      group: webling-sync-${{ inputs.environment || 'prod' }}
      cancel-in-progress: false

    env:
      WEBLING_DOMAIN: ${{ vars.WEBLING_DOMAIN }}
      WEBLING_API_KEY: ${{ secrets.WEBLING_API_KEY }}
      WEBLING_EMAIL: ${{ secrets.WEBLING_EMAIL }}
      WEBLING_PASSWORD: ${{ secrets.WEBLING_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Real member data only goes to prod; every other target gets fake
      # names, birthdays, phone numbers and emails (see anonymize() in webling.py)
      ANONYMIZE: ${{ (inputs.environment || 'prod') == 'prod' && 'false' || 'true' }}
      # Show log lines as they happen instead of when the buffer flushes
      PYTHONUNBUFFERED: '1'

    defaults:
      run:
        working-directory: webling-sync

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webling-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Members first: event participants reference member ids
      - name: Sync members
        if: ${{ (inputs.sync || 'all') != 'events' }}
        run: python src/webling.py

      # Run even when the member sync failed, so one broken member does not
      # also leave the event registrations stale; the job still ends red
      - name: Sync events
        if: ${{ !cancelled() && (inputs.sync || 'all') != 'members' }}
        run: python src/events.py
