name: Webling Sync

# Pulls members and events (incl. participant registrations) from Webling into
# Supabase through the integration layer (integration_begin/stage/apply/finish,
# docs/INTEGRATIONS.md); see webling-sync/README.md for the required GitHub
# environments and secrets.

on:
  schedule:
    # Daily at 22:47 UTC (00:47 CEST / 23:47 CET), off the full hour because
    # GitHub delays scheduled runs that start at :00. Scheduled runs only
    # exist on the default branch and always sync prod.
    - cron: '47 22 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Supabase project'
        type: choice
        options: [prod, dev]
        default: prod
      sync:
        description: 'What to sync'
        type: choice
        options: [all, members, events]
        default: all
      dry_run:
        description: >-
          Read Webling and let the layer say what it would do, without
          writing anything
        type: boolean
        default: false
      accept_gone:
        description: >-
          Members gone from Webling to accept although more than a tenth left
          at once: the exact number from the refused run's error line, after
          checking Webling. Empty for normal runs.
        type: string
        default: ''
      accept_status_drop:
        description: >-
          Members to accept losing their active or passive membership although
          more than the guard allows at once: the exact number from the refused
          run's error line, after checking the groups in Webling. Empty for
          normal runs.
        type: string
        default: ''
      accept_status_gain:
        description: >-
          Members to accept starting to count as active or passive (and being
          let in) although more than the guard allows at once: the exact number
          from the refused run's error line. Empty for normal runs.
        type: string
        default: ''
      accept_events_gone:
        description: >-
          Events or holidays gone from Webling to accept although more than a
          tenth went at once: the exact number from the refused run's error
          line. Empty for normal runs.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets (WEBLING_*, SUPABASE_*) live in the GitHub environment of the same name
    environment: ${{ inputs.environment || 'prod' }}
    concurrency:
      group: webling-sync-${{ inputs.environment || 'prod' }}
      cancel-in-progress: false

    env:
      WEBLING_DOMAIN: ${{ vars.WEBLING_DOMAIN }}
      WEBLING_API_KEY: ${{ secrets.WEBLING_API_KEY }}
      WEBLING_EMAIL: ${{ secrets.WEBLING_EMAIL }}
      WEBLING_PASSWORD: ${{ secrets.WEBLING_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Manual runs only: see accept_* above and docs/INTEGRATIONS.md. They
      # become the apply's overrides (accept_gone, ...)
      WEBLING_ACCEPT_GONE: ${{ inputs.accept_gone || '' }}
      WEBLING_ACCEPT_STATUS_DROP: ${{ inputs.accept_status_drop || '' }}
      WEBLING_ACCEPT_STATUS_GAIN: ${{ inputs.accept_status_gain || '' }}
      WEBLING_ACCEPT_EVENTS_GONE: ${{ inputs.accept_events_gone || '' }}
      INTEGRATION_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # Recorded in integration_runs
      INTEGRATION_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      INTEGRATION_RUNNER: github:${{ github.run_id }}
      # Real member data only goes to prod; every other target gets fake
      # names, birthdays, phone numbers and emails (see src/integration/anonymize.py)
      ANONYMIZE: ${{ (inputs.environment || 'prod') == 'prod' && 'false' || 'true' }}
      # Show log lines as they happen instead of when the buffer flushes
      PYTHONUNBUFFERED: '1'
      # healthchecks.io ping URL, set in the prod environment only (see
      # docs/UPTIME_MONITORING.md); without it the run is not reported
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    defaults:
      run:
        working-directory: webling-sync

    steps:
      # healthchecks.io alerts when a run fails or no run arrives in time.
      # A failed ping never fails the sync, but shows as a warning on the run.
      # Whitespace is stripped: a line break pasted into the secret made curl
      # reject the URL ("Malformed input") on every run until October 2026.
      - name: Report start to healthchecks.io
        if: ${{ env.HEALTHCHECK_URL != '' }}
        working-directory: .
        run: |
          url=$(printf '%s' "$HEALTHCHECK_URL" | tr -d '[:space:]')
          curl -fsS -m 10 --retry 3 -o /dev/null "$url/start" ||
            echo "::warning::healthchecks.io start ping failed, check the HEALTHCHECK_URL secret"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webling-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Members first: event participants reference member ids.
      - name: Sync members
        if: ${{ (inputs.sync || 'all') != 'events' }}
        run: python src/sync.py members

      # Run even when the member sync failed, so one broken member does not
      # also leave the event registrations stale; the job still ends red
      - name: Sync events
        if: ${{ !cancelled() && (inputs.sync || 'all') != 'members' }}
        run: python src/sync.py events

      - name: Report result to healthchecks.io
        if: ${{ always() && env.HEALTHCHECK_URL != '' }}
        working-directory: .
        run: |
          if [ "$JOB_STATUS" = "success" ]; then suffix=""; else suffix="/fail"; fi
          url=$(printf '%s' "$HEALTHCHECK_URL" | tr -d '[:space:]')
          curl -fsS -m 10 --retry 3 -o /dev/null "$url$suffix" ||
            echo "::warning::healthchecks.io result ping failed, check the HEALTHCHECK_URL secret"
        env:
          JOB_STATUS: ${{ job.status }}
