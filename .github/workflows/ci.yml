name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Lint
        run: npm run lint

      - name: Type check
        # Pre-existing Skeleton UI v0.x type mismatches — tracked in TODO.md
        continue-on-error: true
        run: npm run check

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (public only)
        run: npx playwright test --project=public

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  db-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest
          # Resolving "latest" hits the GitHub API; without a token the runner's
          # shared unauthenticated quota can be exhausted and the job dies in setup.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      # Applies every migration plus seed.sql to a fresh database and fails
      # on the first broken statement — the same thing the Supabase preview
      # branch will do, but without needing branching or any secrets.
      - name: Apply migrations and seed to a fresh database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-check, unit-tests]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Build
        run: npm run build
