name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Unit tests
        run: npm run test:unit -- --run

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (public only)
        run: npx playwright test --project=public

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # The Webling sync (webling-sync/) writes to prod every night from main
  sync-scripts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webling-sync

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webling-sync/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

  db-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest
          # Resolving "latest" hits the GitHub API; without a token the runner's
          # shared unauthenticated quota can be exhausted and the job dies in setup.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      # Applies every migration plus seed.sql to a fresh database and fails
      # on the first broken statement — the same thing the Supabase preview
      # branch will do, but without needing branching or any secrets.
      - name: Apply migrations and seed to a fresh database
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint

      # Who may read what (member accounts need an active or passive
      # membership): every lifecycle case as member, admin and sync, in one
      # transaction that is rolled back; a failed check stops with its name
      - name: Check member access rules
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -q -f supabase/checks/member_access.sql

      # What member accounts see of other members (badges, grades, medals and
      # photos of the club's members only, staff everything), probed over
      # every table, view and RPC; fails for an API function bypassing RLS
      # that is not listed there with its guard
      - name: Check member data rules
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -q -f supabase/checks/member_data.sql

      # Merging a duplicate member: every reference moves, the preview equals
      # the merge, refusals, and every foreign key to members is handled
      - name: Check merging duplicate members
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -q -f supabase/checks/merge_members.sql

      # The integration layer: the seeded mapping is the old status rule,
      # guards, identity, events, holidays, run log, the status rule kept
      # internal, links to the provider's records (record_urls)
      - name: Check integration layer
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -q -f supabase/checks/integration_layer.sql

      # End dates and all day: 00:00 to 00:00 is all day for every writer,
      # the date checks, the overlap filters, capabilities version 2,
      # Webling's holidays as the plan's breaks
      - name: Check event dates and holidays
        run: >-
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -q -f supabase/checks/event_dates.sql

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: webling-sync/requirements*.txt

      - name: Install sync dependencies
        run: pip install -r webling-sync/requirements-dev.txt

      # The Webling sync against this database (each check above was rolled
      # back, so it is still fresh): sync.py with a fake Webling built from
      # the seed's members, the layer's functions called through psql as
      # service_role; LAYER_TEST_REQUIRED makes a missing LAYER_TEST_PSQL an
      # error instead of a skip (webling-sync/tests/test_layer_local_db.py)
      - name: Run the sync against the database
        working-directory: webling-sync
        env:
          LAYER_TEST_PSQL: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -q
          LAYER_TEST_REQUIRED: '1'
        run: pytest tests/test_layer_local_db.py

      # The public demo (docs/DEMO.md) gets supabase/demo/seed.sql on top of
      # the migrations alone, every week; prove it still loads and passes its
      # checks with this branch's migrations
      - name: Load and check the demo club
        run: |
          supabase db reset --no-seed
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -1 -v ON_ERROR_STOP=1 -q -f supabase/demo/seed.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -q -f supabase/checks/demo_seed.sql

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-check, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The supabase package downloads its CLI binary in postinstall; retry so
        # one dropped connection on the runner does not fail the whole job.
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s"
            sleep 15
          done

      - name: Create env file
        run: |
          echo 'PUBLIC_SUPABASE_DATABASE_URL=http://localhost:54321' >> .env
          echo 'PUBLIC_SUPABASE_ANON_KEY=placeholder' >> .env
          echo 'PUBLIC_SUPABASE_SITE_URL=http://localhost:5173' >> .env
          echo 'PUBLIC_MODE=DEV' >> .env

      - name: Build
        run: npm run build
