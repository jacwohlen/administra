# Tooling for the sync scripts (they are run as plain scripts, not installed)

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Errors only (undefined names, unused imports, bare except, ...): the scripts
# keep their own formatting
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
