[build]
  command = "npm run build"
  publish = "build"

# Node 22: current Supabase client libraries require it (Node 20 is EOL).
[build.environment]
  NODE_VERSION = "22"

# Deploy Previews resolve the PR's Supabase preview branch credentials
# before building — see docs/SUPABASE_BRANCHING.md.
[context.deploy-preview]
  command = "bash scripts/netlify-preview-supabase-env.sh npm run build"

# Security headers for static files (served by the CDN). Pages and API
# responses get the same values, plus frame-ancestors, from
# src/hooks.server.ts; see docs/SECURITY_HEADERS.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
